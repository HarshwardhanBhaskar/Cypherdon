server:
  port: 8080

spring:
  application:
    name: cypherdon-core
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false # Disable in production to reduce log noise

# JWT Configuration for Supabase Auth
jwt:
  secret: ${JWT_SECRET}

# Internal service-to-service authentication
cypherdon:
  internal:
    secret: ${INTERNAL_SERVICE_KEY:cypherdon_internal_123}
  fastapi:
    url: ${FASTAPI_URL:http://localhost:8000}

# Observability - Expose Prometheus Metrics
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# Resilience4j Circuit Breaker and Retry Configuration
resilience4j.circuitbreaker:
  instances:
    aiEngine:
      slidingWindowSize: 10
      failureRateThreshold: 50
      waitDurationInOpenState: 15s
      permittedNumberOfCallsInHalfOpenState: 3

resilience4j.retry:
  instances:
    aiEngine:
      maxAttempts: 3
      waitDuration: 2s
